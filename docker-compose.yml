version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: research-swarm-db
    environment:
      POSTGRES_USER: swarm
      POSTGRES_PASSWORD: swarm
      POSTGRES_DB: research_swarm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarm -d research_swarm"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - research-swarm-net

  ollama:
    image: ollama/ollama:latest
    container_name: research-swarm-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - research-swarm-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: research-swarm-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://swarm:swarm@postgres:5432/research_swarm
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=http://localhost:3000
      - VECTOR_DB_PATH=/data/chroma_db
      - UPLOAD_DIR=/data/uploads
      - LOG_LEVEL=INFO
      - PLANNER_MODEL=${PLANNER_MODEL:-qwen3:14b}
      - RESEARCH_MODEL=${RESEARCH_MODEL:-llama3:8b}
      - DOCUMENT_MODEL=${DOCUMENT_MODEL:-gemma3:12b}
      - ANSWER_MODEL=${ANSWER_MODEL:-gemma3:12b}
    volumes:
      - backend_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - research-swarm-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: research-swarm-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - research-swarm-net

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local
  backend_data:
    driver: local

networks:
  research-swarm-net:
    driver: bridge
