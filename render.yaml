services:
  - type: web
    name: research-swarm-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: openrouter
      - key: PLANNER_MODEL
        value: qwen/qwen3-32b
      - key: RESEARCH_MODEL
        value: google/gemini-2.5-flash
      - key: DOCUMENT_MODEL
        value: qwen/qwen3-32b
      - key: ANSWER_MODEL
        value: mistralai/mistral-small-3.2-24b-instruct
      - key: CORS_ORIGINS
        value: https://research-swarm-omega.vercel.app
      - key: LOG_LEVEL
        value: INFO
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: EMBEDDING_MODEL
        value: openai/text-embedding-3-small
