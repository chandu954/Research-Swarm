services:
  - type: web
    name: research-swarm-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: openrouter
      - key: PLANNER_MODEL
        value: qwen/qwen3-32b
      - key: RESEARCH_MODEL
        value: google/gemini-2.5-flash
      - key: DOCUMENT_MODEL
        value: qwen/qwen3-32b
      - key: ANSWER_MODEL
        value: mistralai/mistral-small-3.2-24b-instruct
      - key: APP_URL
        # Set to the deployed frontend URL at deploy time (exact production
        # origin is a deployment decision, not a hardcoded value).
        sync: false
      - key: CORS_ORIGINS
        # Set to the exact frontend origin(s), e.g.
        # https://research-swarm.vercel.app (comma-separated for multiples).
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_BRIDGE_SECRET
        sync: false
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: VECTOR_DB_PATH
        value: /data/chroma_db
      - key: EMBEDDING_MODEL
        value: openai/text-embedding-3-small
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://research-swarm-api.onrender.com/auth/google/callback
