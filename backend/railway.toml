[build]
  builder = "DOCKERFILE"
  dockerfilePath = "backend/Dockerfile"

[deploy]
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3

[service]
  port = 8000

[[env]]
  name = "LLM_PROVIDER"
  value = "openrouter"

[[env]]
  name = "PLANNER_MODEL"
  value = "qwen/qwen3-32b"

[[env]]
  name = "RESEARCH_MODEL"
  value = "google/gemini-2.5-flash"

[[env]]
  name = "DOCUMENT_MODEL"
  value = "qwen/qwen3-32b"

[[env]]
  name = "ANSWER_MODEL"
  value = "mistralai/mistral-small-3.2-24b-instruct"

[[env]]
  name = "CORS_ORIGINS"
  # Set to the exact production frontend URL at deploy time, e.g.
  # https://research-swarm.vercel.app — comma-separated for multiples.
  sync = false

[[env]]
  name = "LOG_LEVEL"
  value = "INFO"

[[env]]
  name = "ENVIRONMENT"
  value = "production"

[[volumes]]
  name = "backend_data"
  mount = "/data"
